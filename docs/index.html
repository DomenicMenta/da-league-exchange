<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="DA Dynasty League Exchange — the open market for dynasty football teams." />
    <meta http-equiv="refresh" content="2;url=https://da-league-exchange.da-league-exchange.workers.dev/" />
    <title>DA Dynasty League Exchange</title>
    <style>
      :root { color-scheme: dark; --gold: #f2b84b; --orange: #c9510c; --ink: #080a09; --cream: #f6eedc; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 10%, #29220f 0, var(--ink) 48%); color: var(--cream); font-family: Arial, Helvetica, sans-serif; }
      main { width: min(720px, 100%); padding: 56px 44px; border: 1px solid rgba(242,184,75,.38); background: rgba(8,10,9,.86); box-shadow: 12px 12px 0 var(--orange); text-align: center; }
      .mark { width: 86px; height: 86px; margin: 0 auto 26px; display: grid; place-items: center; border: 2px solid var(--gold); border-radius: 50%; color: var(--gold); font: 800 32px Georgia, serif; }
      .eyebrow { margin: 0 0 12px; color: var(--gold); font-size: 12px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; }
      h1 { margin: 0; font: 700 clamp(36px, 8vw, 68px)/.95 Georgia, serif; }
      p { margin: 24px auto 30px; max-width: 530px; color: #c7c1b5; font-size: 18px; line-height: 1.6; }
      a { display: inline-block; padding: 16px 24px; background: linear-gradient(135deg, #e26b17, var(--orange)); color: white; font-weight: 800; text-decoration: none; box-shadow: 5px 5px 0 var(--gold); }
      a:focus, a:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--gold); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">DA</div>
      <p class="eyebrow">Dynasty's open market</p>
      <h1>DA Dynasty<br />League Exchange</h1>
      <p>Opening the live marketplace now. Browse real dynasty teams, inspect league details, and find your next franchise.</p>
      <a href="https://da-league-exchange.da-league-exchange.workers.dev/">Enter the exchange →</a>
    </main>
  </body>
</html>
